# Runs the Bronze->Silver job in Spark local mode inside one pod (light enough for a laptop).
# Later you replace this with the Spark Operator, so executors run as separate pods.
apiVersion: batch/v1
kind: Job
metadata: {name: bronze-to-silver, namespace: lakehouse}
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: spark
          image: apache/spark:3.5.3-python3   # check a current tag; Iceberg package below must match the Spark version
          envFrom: [{secretRef: {name: s3-credentials}}]
          command: ["/opt/spark/bin/spark-submit"]
          args:
            - --master=local[2]
            - --driver-memory=1g
            - --packages=org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.7.1,org.apache.iceberg:iceberg-aws-bundle:1.7.1
            - --conf=spark.jars.ivy=/tmp/ivy
            - --conf=spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
            - --conf=spark.sql.catalog.lh=org.apache.iceberg.spark.SparkCatalog
            - --conf=spark.sql.catalog.lh.type=rest
            - --conf=spark.sql.catalog.lh.uri=http://iceberg-rest:8181
            - --conf=spark.sql.catalog.lh.warehouse=s3://warehouse/
            - --conf=spark.sql.catalog.lh.io-impl=org.apache.iceberg.aws.s3.S3FileIO
            - --conf=spark.sql.catalog.lh.s3.endpoint=http://localstack:4566
            - --conf=spark.sql.catalog.lh.s3.path-style-access=true
            - /job/bronze_to_silver.py
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {memory: 2Gi}}
          volumeMounts: [{name: job, mountPath: /job}]
      volumes: [{name: job, configMap: {name: bronze-to-silver-code}}]
