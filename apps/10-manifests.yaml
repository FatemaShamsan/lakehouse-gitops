# MinIO, Iceberg REST catalog, Gateway, Kyverno policy: plain manifests from this repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lakehouse-manifests
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  project: default
  source:
    repoURL: https://github.com/FatemaShamsan/lakehouse-gitops.git
    targetRevision: main
    path: manifests
    directory: {recurse: true}
  destination: {server: https://kubernetes.default.svc, namespace: lakehouse}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
    retry: {limit: 5, backoff: {duration: 20s, factor: 2}}   # waits for Gateway and Kyverno CRDs
